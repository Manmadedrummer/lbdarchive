<script>
  function formatTime(sec) {
    if (!Number.isFinite(sec) || sec < 0) return "0:00";
    const mins = Math.floor(sec / 60);
    const rem = Math.floor(sec % 60);
    return mins + ":" + String(rem).padStart(2, "0");
  }

  document.querySelectorAll(".web-player").forEach((player) => {
    const audio = player.querySelector("audio");
    const nowPlaying = player.querySelector(".web-player__now");
    const seek = player.querySelector(".web-player__seek");
    const currentEl = player.querySelector(".web-player__current");
    const durationEl = player.querySelector(".web-player__duration");
    const buttons = Array.from(player.querySelectorAll(".track-btn"));

    function setProgressBar(pct) {
      const clamped = Math.max(0, Math.min(100, pct));
      seek.value = clamped;
      seek.style.setProperty("--pct", clamped + "%");
    }

    function playTrack(btn, autoPlay = true) {
      const src = btn.getAttribute("data-src");
      const title = btn.getAttribute("data-title") || btn.textContent.trim();
      if (!src) return;

      buttons.forEach((b) => b.classList.remove("is-active"));
      btn.classList.add("is-active");
      nowPlaying.textContent = "Playing: " + title;
      setProgressBar(0);
      currentEl.textContent = "0:00";
      durationEl.textContent = "0:00";
      audio.src = src;
      if (autoPlay) {
        audio.play().catch(() => {});
      }
    }

    audio.addEventListener("loadedmetadata", () => {
      durationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener("timeupdate", () => {
      if (Number.isFinite(audio.duration) && audio.duration > 0) {
        const pct = (audio.currentTime / audio.duration) * 100;
        setProgressBar(pct);
      }
      currentEl.textContent = formatTime(audio.currentTime);
    });

    seek.addEventListener("input", () => {
      const pct = parseFloat(seek.value) || 0;
      seek.style.setProperty("--pct", pct + "%");
      if (Number.isFinite(audio.duration) && audio.duration > 0) {
        audio.currentTime = (pct / 100) * audio.duration;
        currentEl.textContent = formatTime(audio.currentTime);
      }
    });

    buttons.forEach((btn, idx) => {
      btn.addEventListener("click", () => playTrack(btn, true));
      audio.addEventListener("ended", () => {
        if (btn.classList.contains("is-active") && idx + 1 < buttons.length) {
          playTrack(buttons[idx + 1], true);
        }
      });
    });
  });
</script>
