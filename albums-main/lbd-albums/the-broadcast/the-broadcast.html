<script>
  document.querySelectorAll(".web-player").forEach((player) => {
    const audio = player.querySelector("audio");
    const nowPlaying = player.querySelector(".web-player__now");
    const buttons = Array.from(player.querySelectorAll(".track-btn"));

    function playTrack(btn, autoPlay = true) {
      const src = btn.getAttribute("data-src");
      const title = btn.getAttribute("data-title") || btn.textContent.trim();
      if (!src) return;

      buttons.forEach((b) => b.classList.remove("is-active"));
      btn.classList.add("is-active");
      nowPlaying.textContent = "Playing: " + title;
      audio.src = src;
      if (autoPlay) {
        audio.play().catch(() => {});
      }
    }

    buttons.forEach((btn, idx) => {
      btn.addEventListener("click", () => playTrack(btn, true));
      audio.addEventListener("ended", () => {
        if (btn.classList.contains("is-active") && idx + 1 < buttons.length) {
          playTrack(buttons[idx + 1], true);
        }
      });
    });
  });
</script>
